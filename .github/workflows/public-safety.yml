name: Public source safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  credential-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/audit-public-source.py --history
