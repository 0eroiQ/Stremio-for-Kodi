name: Release v1.0.38

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate source
        run: |
          python3 -m unittest discover -s tests
          python3 tools/audit-public-source.py --history

      - name: Verify release version
        run: grep -q 'version="1.0.38"' addon.xml

      - name: Build addon package
        run: python3 tools/build-stremio-addon.py --output dist

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.38
        run: |
          set -euo pipefail
          PACKAGE="dist/script.stremioelec-1.0.38.zip"
          test -f "$PACKAGE"
          cat > /tmp/release-notes.md <<'EOF'
          ## Stremio for Kodi 1.0.38

          - Improve Stremio sign-in failure handling and diagnostics.
          - Distinguish Stremio service/API failures from local network failures.
          - Improve unexpected-response handling during account linking.
          - Fix Windows sign-in failures caused by transient permission errors while saving account state.
          - Keep the privacy-minimised anonymous error-reporting flow for easier diagnosis.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
            gh release edit "$TAG" --title "Stremio for Kodi 1.0.38" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "$PACKAGE" \
              --target "${GITHUB_SHA}" \
              --title "Stremio for Kodi 1.0.38" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Check out Kodi repository feed
        uses: actions/checkout@v4
        with:
          ref: kodi-repository
          path: dist/feed

      - name: Publish Kodi repository feed and installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.38
        run: |
          set -euo pipefail
          python3 tools/build-kodi-repository.py \
            --package dist/script.stremioelec-1.0.38.zip \
            --output dist/feed
          git -C dist/feed config user.name 'github-actions[bot]'
          git -C dist/feed config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C dist/feed add addons.xml addons.xml.sha256 README.md script.stremioelec repository.stremioforkodi
          if ! git -C dist/feed diff --cached --quiet; then
            git -C dist/feed commit -m "Publish ${TAG} to Kodi repository"
            git -C dist/feed push origin kodi-repository
          fi
          gh release upload "$TAG" \
            dist/feed/repository.stremioforkodi/repository.stremioforkodi-*.zip \
            --clobber
