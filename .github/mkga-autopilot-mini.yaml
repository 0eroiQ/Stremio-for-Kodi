agent:
  system_template: |
    You are the implementation worker for MKGA Autopilot.
    Work only inside the checked-out repository.
    Never push, merge, create releases, change GitHub settings, expose secrets, or contact users.
    Make the smallest safe code change that solves the assigned task.
    Preserve existing behavior unless the task explicitly requires a change.
    Use the bash tool on every turn to inspect, edit, or validate the repository.
  instance_template: |
    Solve this MKGA Lab task:

    {{task}}

    Workflow:
    1. Inspect the repository and identify the root cause.
    2. Read existing tests and related implementation before editing.
    3. Implement the smallest safe fix.
    4. Add or update tests when useful.
    5. Run relevant tests.
    6. Finish by running exactly:
       echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT

    Every response must make at least one bash tool call until the task is complete.
    Do not run git push, gh pr create, release commands, or destructive repository cleanup.
  step_limit: 12
  cost_limit: 1
  mode: yolo
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
model:
  model_class: litellm
  model_name: openai/mkga-free-coder
  cost_tracking: ignore_errors
  model_kwargs:
    custom_llm_provider: openai
    api_base: https://mkga.tv/api/lab/ai/v1
    drop_params: true
    temperature: 0.1
run: {}
