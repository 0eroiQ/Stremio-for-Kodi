name: Release v1.0.35

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.0.35.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate source
        run: |
          python3 -m unittest discover -s tests
          python3 tools/audit-public-source.py --history

      - name: Build addon package
        run: python3 tools/build-stremio-addon.py --output dist

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.35
        run: |
          set -euo pipefail
          PACKAGE="dist/script.stremioelec-1.0.35.zip"
          test -f "$PACKAGE"
          cat > /tmp/release-notes.md <<'EOF'
          ## Stremio for Kodi 1.0.35

          - Fix Stremio QR linking compatibility with current link-service response variants.
          - Accept both authKey/auth_key and nested/top-level link-service response shapes.
          - Keep playable direct HTTPS debrid streams even when providers also include infoHash or externalUrl metadata.
          - Continue rejecting streams that require proxyHeaders.
          - Add regression tests for the Reddit-reported login and provider issues.

          This is a focused public-feedback hotfix on top of v1.0.34.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
            gh release edit "$TAG" --title "Stremio for Kodi 1.0.35" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "$PACKAGE" \
              --target "${GITHUB_SHA}" \
              --title "Stremio for Kodi 1.0.35" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Check out Kodi repository feed
        uses: actions/checkout@v4
        with:
          ref: kodi-repository
          path: dist/feed

      - name: Publish Kodi repository feed and installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.35
        run: |
          set -euo pipefail
          python3 tools/build-kodi-repository.py \
            --package dist/script.stremioelec-1.0.35.zip \
            --output dist/feed
          git -C dist/feed config user.name 'github-actions[bot]'
          git -C dist/feed config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C dist/feed add addons.xml addons.xml.sha256 README.md script.stremioelec repository.stremioforkodi
          if ! git -C dist/feed diff --cached --quiet; then
            git -C dist/feed commit -m "Publish ${TAG} to Kodi repository"
            git -C dist/feed push origin kodi-repository
          fi
          gh release upload "$TAG" \
            dist/feed/repository.stremioforkodi/repository.stremioforkodi-*.zip \
            --clobber
