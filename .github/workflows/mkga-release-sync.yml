name: Sync release to MKGA.TV

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync (for manual recovery)
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            TAG="$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)"
          fi
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" > /tmp/mkga-github-release.json
          test "$(jq -r .tag_name /tmp/mkga-github-release.json)" = "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sync MKGA project release
        env:
          MKGA_RELEASE_SYNC_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$MKGA_RELEASE_SYNC_TOKEN"
          jq --arg version "$TAG" '{version:$version,githubRelease:.}' \
            /tmp/mkga-github-release.json > /tmp/mkga-release-sync.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $MKGA_RELEASE_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/mkga-release-sync.json \
            https://mkga.tv/api/projects/stremio-for-kodi/release-sync
